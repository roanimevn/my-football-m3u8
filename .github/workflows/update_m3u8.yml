name: Auto Update M3U8 Playlist

on:
  schedule:
    - cron: '0 0 * * *'  # Chạy tự động lúc 07:00 AM giờ Việt Nam
  workflow_dispatch:      # Cho phép bấm chạy thủ công

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write    # Cấp quyền ghi vào Repository

    steps:
      # 1. Checkout mã nguồn và chỉ định rõ nhánh 'main' để tránh lỗi Detached HEAD
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Cài đặt Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài đặt thư viện
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Chạy script tạo file M3U8
      - name: Run Python script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python generate_m3u8.py

      # 5. Commit và Push trực tiếp vào nhánh main
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add highlight_football.m3u8
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới trong file M3U8."
          else
            git commit -m "auto: Cập nhật playlist M3U8 mới nhất"
            git push origin main
          fi
