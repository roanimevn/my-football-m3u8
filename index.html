<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight Bóng Đá Trực Tiếp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>⚽ HIGHLIGHT BÓNG ĐÁ MỚI NHẤT</h1>
    </div>

    <div class="player-container">
        <div class="live-badge">
            <span class="dot"></span> 🔴 LIVE
        </div>
        <div class="iframe-wrapper">
            <iframe id="main-player" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div class="playlist-container">
        <h3>Danh Sách Kênh Highlights</h3>
        <div id="playlist" class="playlist-grid">Đang tải danh sách kênh...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
